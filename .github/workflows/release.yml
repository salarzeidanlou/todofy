name: Release

# Publishes a release when a version bump lands on main. The version is read
# from package.json; a published release is never rebuilt, while a failed
# draft can be resumed after a workflow fix. Release notes are pulled from
# the matching section of CHANGELOG.md.
#
# Builds run on Linux, macOS (universal: Intel + Apple Silicon in one .dmg),
# and Windows, each uploading its bundle to the same draft release. The
# release is only flipped to published once every platform has succeeded —
# if one leg fails, the others' assets still land on the draft so it can be
# inspected and published by hand.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.detect.outputs.version }}
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect version and whether it needs releasing
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if RELEASE_DRAFT=$(gh release view "v$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$RELEASE_DRAFT" = "true" ]; then
              echo "Release v$VERSION is still a draft — resuming its build."
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release v$VERSION is already published — nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "v$VERSION is new — will build and publish."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-22.04
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_SCHEMA: ${{ secrets.VITE_SUPABASE_SCHEMA }}
      VITE_TODOFY_API_URL: ${{ secrets.VITE_TODOFY_API_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate version and official release configuration
        shell: bash
        run: |
          for NAME in \
            VITE_SUPABASE_URL \
            VITE_SUPABASE_PUBLISHABLE_KEY \
            VITE_SUPABASE_SCHEMA \
            VITE_TODOFY_API_URL \
            VITE_GOOGLE_CLIENT_ID \
            VITE_GOOGLE_CLIENT_SECRET \
            TAURI_SIGNING_PRIVATE_KEY
          do
            if [ -z "${!NAME}" ]; then
              echo "::error::$NAME is required for an official release."
              exit 1
            fi
          done

          node <<'NODE'
          const fs = require('node:fs');
          const packageVersion = require('./package.json').version;
          const tauriConfig = require('./src-tauri/tauri.conf.json');
          const tauriVersion = tauriConfig.version;
          const cargo = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^version = "([^"]+)"/m)?.[1];
          if (!packageVersion || packageVersion !== tauriVersion || packageVersion !== cargoVersion) {
            throw new Error(`Version mismatch: package=${packageVersion}, tauri=${tauriVersion}, cargo=${cargoVersion}`);
          }
          const changelog = fs.readFileSync('./CHANGELOG.md', 'utf8');
          if (!changelog.includes(`## v${packageVersion} `)) {
            throw new Error(`CHANGELOG.md has no v${packageVersion} section`);
          }
          // An unsigned or unannounced release can never be updated into, and
          // the mistake only shows up once users are already stranded on it.
          if (tauriConfig.bundle?.createUpdaterArtifacts !== true) {
            throw new Error('bundle.createUpdaterArtifacts must be true to ship updates');
          }
          const updater = tauriConfig.plugins?.updater ?? {};
          if (!updater.pubkey) {
            throw new Error('plugins.updater.pubkey is missing');
          }
          const updaterPublicKey = Buffer.from(updater.pubkey, 'base64').toString('utf8').match(/^RW\S+/m)?.[0];
          const voiceSource = fs.readFileSync('./src-tauri/src/voice/assets.rs', 'utf8');
          const voicePublicKey = voiceSource.match(/const PUBLIC_KEY: &str = "([^"]+)"/)?.[1];
          if (!updaterPublicKey || voicePublicKey !== updaterPublicKey) {
            throw new Error('Voice catalog public key must match the updater signing key');
          }
          if (!updater.endpoints?.some((url) => url.startsWith('https://'))) {
            throw new Error('plugins.updater.endpoints must hold an HTTPS endpoint');
          }
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY;
          if (key.startsWith('sb_secret_')) {
            throw new Error('A Supabase secret key must never be embedded in the desktop app');
          }
          const parts = key.split('.');
          if (parts.length === 3) {
            try {
              const payload = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
              if (payload.role === 'service_role') {
                throw new Error('A Supabase service-role key must never be embedded in the desktop app');
              }
            } catch (error) {
              if (error.message.includes('service-role')) throw error;
            }
          }
          NODE

      - name: Verify production API and live EUR catalog
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 3 "$VITE_TODOFY_API_URL/readyz"
          CATALOG_JSON=$(curl --fail --show-error --silent --retry 3 "$VITE_TODOFY_API_URL/v1/plans")
          CATALOG_JSON="$CATALOG_JSON" node <<'NODE'
          const catalog = JSON.parse(process.env.CATALOG_JSON);
          const expected = {
            monthly: { product_id: 1362532, variant_id: 2127761, amount: 399, interval: 'month' },
            yearly: { product_id: 1362532, variant_id: 2127785, amount: 3900, interval: 'year' },
          };
          if (catalog.test_mode !== false || !Array.isArray(catalog.plans) || catalog.plans.length !== 2) {
            throw new Error('Production billing catalog is unavailable or still in test mode');
          }
          for (const plan of catalog.plans) {
            const wanted = expected[plan.id];
            if (!wanted || plan.currency !== 'EUR' || Object.entries(wanted).some(([key, value]) => plan[key] !== value)) {
              throw new Error(`Unexpected production plan: ${JSON.stringify(plan)}`);
            }
            const checkout = new URL(plan.checkout_url);
            if (checkout.protocol !== 'https:' || !(checkout.hostname === 'lemonsqueezy.com' || checkout.hostname.endsWith('.lemonsqueezy.com'))) {
              throw new Error(`Unsafe checkout URL for ${plan.id}`);
            }
          }
          NODE

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*microsoft*.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile

      - name: Audit production frontend dependencies
        run: bun audit --production

      - name: Build frontend
        run: bun run build

      - name: Test frontend
        run: bun run test

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  release:
    needs: [check, validate]
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          NOTES=$(awk -v v="## v$VERSION" '
            index($0, v) == 1 { grab = 1; next }
            /^## v/ && grab { exit }
            grab { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Download a bundle below for your platform."
          fi
          {
            echo 'RELEASE_NOTES<<CHANGELOG_EOF'
            printf '%s\n' "$NOTES"
            echo ''
            echo '---'
            echo 'Download a bundle below for your platform (.deb/.rpm/.AppImage for Linux, .dmg for macOS, .msi/.exe for Windows).'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Everything below comes from the Ubuntu archive, but apt-get update
          # exits non-zero if *any* configured source fails. The runner image
          # ships Google and Microsoft repos whose CDNs intermittently serve an
          # index that doesn't match their Release file ("Hash Sum mismatch"),
          # which would fail the release for reasons unrelated to it.
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*microsoft*.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev squashfs-tools

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS builds need both Apple Silicon and Intel targets;
          # Linux/Windows just use the runner's default host target.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The bundler chmods every tool it downloads to 0770 and then copies
      # AppRun straight into the AppDir, so the launcher ends up runnable by
      # nobody but its owner. Nothing goes wrong when the runtime mounts the
      # image for the user who started it, but a sandbox that mounts it as root
      # — firejail --appimage, and the AppImage catalog's test — cannot exec it.
      # The bundler only downloads what is missing, so seed the cache instead.
      # Remove once tauri-apps/tauri#16155 ships.
      - name: Seed the AppImage launcher with world-readable permissions
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          TOOLS="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          ARCH="$(uname -m)"
          mkdir -p "$TOOLS"
          curl --fail --show-error --silent --location --retry 3 \
            -o "$TOOLS/AppRun-$ARCH" \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-$ARCH"
          chmod 755 "$TOOLS/AppRun-$ARCH"

      - name: Build and upload bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without it the build fails, which is
          # what we want: an unsigned release can never be updated into.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_SCHEMA: ${{ secrets.VITE_SUPABASE_SCHEMA }}
          VITE_TODOFY_API_URL: ${{ secrets.VITE_TODOFY_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: v${{ needs.check.outputs.version }}
          releaseName: "todofy v${{ needs.check.outputs.version }}"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # The manifest is composed once, after every platform has uploaded —
          # three parallel jobs each merging their own copy would race.
          includeUpdaterJson: false

      # Check the permissions stored in SquashFS. Newer AppImage runtimes
      # create --appimage-extract directories as 0700 without restoring their
      # archived modes, so inspecting that output falsely rejects valid images.
      # unsquashfs restores the stored modes, including genuinely restricted
      # directories. The uploaded release stays a draft until this check passes.
      - name: Reject owner-only files inside the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          APPIMAGE="$(ls -1 src-tauri/target/release/bundle/appimage/*.AppImage | head -1)"
          APPIMAGE="$(readlink -f "$APPIMAGE")"
          chmod +x "$APPIMAGE"
          OFFSET="$("$APPIMAGE" --appimage-offset)"
          if [[ ! "$OFFSET" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid SquashFS offset in $(basename "$APPIMAGE")"
            exit 1
          fi
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          unsquashfs -no-progress -o "$OFFSET" \
            -d "$WORKDIR/squashfs-root" "$APPIMAGE" >/dev/null
          cd "$WORKDIR"
          # Require other-user read access, directory traversal, and execution
          # for any executable file. Data files do not need an executable bit.
          OWNER_ONLY="$(find squashfs-root \( -type f -o -type d \) \
            \( ! -perm -004 \
              -o \( -type d ! -perm -001 \) \
              -o \( -type f -perm /111 ! -perm -001 \) \) \
            -printf '%M %p\n')"
          if [ -n "$OWNER_ONLY" ]; then
            echo "::error::$(basename "$APPIMAGE") holds files no other user can read or run:"
            printf '%s\n' "$OWNER_ONLY"
            exit 1
          fi
          echo "All files in $(basename "$APPIMAGE") are readable; directories and executables are accessible to any user."

  voice-engine:
    needs: [check, validate, release]
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            asset: voice-engine-linux-x86_64
          - platform: macos-latest
            asset: voice-engine-darwin-universal
          - platform: windows-latest
            asset: voice-engine-windows-x86_64.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Build pinned CPU-only whisper.cpp helper
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.9.3 https://github.com/ggml-org/whisper.cpp.git whisper-src
          test "$(git -C whisper-src rev-parse HEAD)" = 371b5a7561823ab2bb32142d2751e35e7534727b
          CMAKE_ARGS=()
          if [[ "${{ matrix.platform }}" == macos-* ]]; then
            CMAKE_ARGS+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64")
          fi
          cmake -S whisper-src -B whisper-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_METAL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_SSE42=OFF \
            -DGGML_AVX=OFF \
            -DGGML_AVX2=OFF \
            -DGGML_BMI2=OFF \
            -DGGML_FMA=OFF \
            -DGGML_F16C=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            "${CMAKE_ARGS[@]}"
          cmake --build whisper-build --config Release --target whisper-cli --parallel 2
          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            BIN=$(find whisper-build -name whisper-cli.exe -type f | head -1)
          else
            BIN=$(find whisper-build -name whisper-cli -type f | head -1)
          fi
          test -n "$BIN"
          if [[ "${{ matrix.platform }}" == macos-* ]]; then
            lipo "$BIN" -verify_arch x86_64 arm64
          fi
          cp "$BIN" '${{ matrix.asset }}'

      - name: Upload optional voice engine
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: gh release upload "v$VERSION" '${{ matrix.asset }}' --repo "$REPO" --clobber

  # Writes the latest.json the in-app updater polls. It must land before the
  # release leaves draft, or the first person to check would be told there is
  # no update.
  manifest:
    needs: [check, validate, release, voice-engine]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install signing CLI
        run: bun install --frozen-lockfile

      - name: Compose the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          mkdir -p signatures
          gh release download "$TAG" --repo "$REPO" --dir signatures --pattern '*.sig'

          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name]')

          ASSETS="$ASSETS" TAG="$TAG" node <<'NODE'
          const fs = require('node:fs');
          const { VERSION, REPO, TAG } = process.env;
          const names = JSON.parse(process.env.ASSETS);

          const url = (name) =>
            `https://github.com/${REPO}/releases/download/${TAG}/${encodeURIComponent(name)}`;
          const signature = (name) =>
            fs.readFileSync(`signatures/${name}.sig`, 'utf8').trim();

          // A universal macOS build serves both architectures from one archive.
          const bundles = names.filter((name) => !name.endsWith('.sig'));
          const wanted = {
            'linux-x86_64': bundles.find((n) => n.endsWith('.AppImage')),
            'darwin-x86_64': bundles.find((n) => n.endsWith('.app.tar.gz')),
            'darwin-aarch64': bundles.find((n) => n.endsWith('.app.tar.gz')),
            'windows-x86_64':
              bundles.find((n) => n.endsWith('-setup.exe')) ??
              bundles.find((n) => n.endsWith('.msi')),
          };

          const missing = Object.entries(wanted).filter(([, name]) => !name);
          if (missing.length) {
            throw new Error(
              `No updater artifact for: ${missing.map(([key]) => key).join(', ')}`,
            );
          }

          const platforms = {};
          for (const [key, name] of Object.entries(wanted)) {
            platforms[key] = { signature: signature(name), url: url(name) };
          }

          fs.writeFileSync(
            'latest.json',
            JSON.stringify(
              {
                version: VERSION,
                // Deliberately a pointer rather than the changelog section:
                // every client fetches this file, and the app links out to
                // the release page for the details.
                notes: `todofy v${VERSION} — https://github.com/${REPO}/releases/tag/${TAG}`,
                pub_date: new Date().toISOString(),
                platforms,
              },
              null,
              2,
            ),
          );
          console.log(`latest.json for v${VERSION}:`);
          console.log(Object.keys(platforms).join(', '));
          NODE

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

      - name: Download and publish optional speech models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for MODEL in tiny base; do
            case "$MODEL" in
              tiny) EXPECTED_SHA1=bd577a113a864445d4c299885e0cb97d4ba92b5f ;;
              base) EXPECTED_SHA1=465707469ff3a37a2b9b8d8f89f2f99de7299dac ;;
            esac
            curl --fail --location --show-error --silent --retry 3 \
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$MODEL.bin" \
              --output "voice-model-$MODEL.ggml"
            test "$(wc -c < "voice-model-$MODEL.ggml")" -gt 1000000
            test "$(sha1sum "voice-model-$MODEL.ggml" | cut -d' ' -f1)" = "$EXPECTED_SHA1"
            gh release upload "v$VERSION" "voice-model-$MODEL.ggml" --repo "$REPO" --clobber
          done

      - name: Compose and sign the voice catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          mkdir -p voice-engine-files
          gh release download "$TAG" --repo "$REPO" --dir voice-engine-files --pattern 'voice-engine-*'
          curl --fail --location --show-error --silent --retry 3 \
            'https://raw.githubusercontent.com/ggml-org/whisper.cpp/371b5a7561823ab2bb32142d2751e35e7534727b/samples/jfk.wav' \
            --output voice-smoke.wav
          chmod 700 voice-engine-files/voice-engine-linux-x86_64
          voice-engine-files/voice-engine-linux-x86_64 \
            -m voice-model-tiny.ggml -f voice-smoke.wav -l en -oj -of voice-smoke -np
          node <<'NODE'
          const fs = require('node:fs');
          const output = JSON.parse(fs.readFileSync('voice-smoke.json', 'utf8'));
          if (!Array.isArray(output.transcription) ||
              !output.transcription.some((segment) => segment.text?.trim())) {
            throw new Error('Voice helper did not produce a transcript');
          }
          NODE
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { VERSION, REPO } = process.env;
          const tag = `v${VERSION}`;
          function asset(path, name) {
            const bytes = fs.readFileSync(path);
            return {
              url: `https://github.com/${REPO}/releases/download/${tag}/${name}`,
              size: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
            };
          }
          const linux = asset('voice-engine-files/voice-engine-linux-x86_64', 'voice-engine-linux-x86_64');
          const mac = asset('voice-engine-files/voice-engine-darwin-universal', 'voice-engine-darwin-universal');
          const windows = asset('voice-engine-files/voice-engine-windows-x86_64.exe', 'voice-engine-windows-x86_64.exe');
          const catalog = {
            schema: 1,
            version: VERSION,
            engines: {
              'linux-x86_64': linux,
              'darwin-x86_64': mac,
              'darwin-aarch64': mac,
              'windows-x86_64': windows,
            },
            models: {
              tiny: asset('voice-model-tiny.ggml', 'voice-model-tiny.ggml'),
              base: asset('voice-model-base.ggml', 'voice-model-base.ggml'),
            },
          };
          fs.writeFileSync('voice-catalog.json', JSON.stringify(catalog, null, 2));
          NODE
          bunx tauri signer sign voice-catalog.json
          test -s voice-catalog.json.sig
          gh release upload "$TAG" voice-catalog.json voice-catalog.json.sig --repo "$REPO" --clobber
          gh release upload "$TAG" docs/third_party/whisper.cpp.LICENSE docs/third_party/openai-whisper.LICENSE --repo "$REPO" --clobber

  publish:
    needs: [check, validate, release, manifest]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.check.outputs.version }}" --draft=false --repo "${{ github.repository }}"
