name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          # Everything below comes from the Ubuntu archive, but apt-get update
          # exits non-zero if *any* configured source fails. The runner image
          # ships Google and Microsoft repos whose CDNs intermittently serve an
          # index that doesn't match their Release file ("Hash Sum mismatch"),
          # which would fail the build for reasons unrelated to it.
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*microsoft*.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Typecheck & build frontend
        run: bun run build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
